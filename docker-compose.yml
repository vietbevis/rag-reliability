name: rag-reliability

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_reliability
    ports:
      # Exposed for local development / running the app outside Docker.
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag_reliability']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override the host: inside the compose network Postgres is "postgres".
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag_reliability?schema=public
      # Inside compose network Neo4j is "neo4j".
      NEO4J_URI: bolt://neo4j:7687
      # Inside compose network Redis is "redis" (BullMQ queue backend).
      REDIS_HOST: redis
      HOST: 0.0.0.0
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    profiles:
      - graph
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jlocalpass}
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        [
          'CMD',
          'cypher-shell',
          '-u',
          'neo4j',
          '-p',
          '${NEO4J_PASSWORD:-neo4jlocalpass}',
          'RETURN 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # BullMQ queue backend cho pipeline xử lý tài liệu (PHASE 1 — queue).
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Lộ ra để chạy app ngoài Docker.
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  neo4jdata:
  redisdata:
